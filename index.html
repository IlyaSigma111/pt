<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблица Менделеева</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>ПЕРИОДИЧЕСКАЯ ТАБЛИЦА ЭЛЕМЕНТОВ</h1>
    <div class="toolbar">
      <div class="view-btns">
        <button id="btnSimple" class="active">Простая</button>
        <button id="btnNames">Названия</button>
        <button id="btnConfig">Конфигурация</button>
      </div>
      <select id="propSelect">
        <option value="weight">Атомная масса</option>
        <option value="radius">Радиус</option>
        <option value="en">ЭО</option>
        <option value="density">Плотность</option>
        <option value="melt">T° плавл.</option>
        <option value="boil">T° кип.</option>
        <option value="state">Состояние</option>
      </select>
      <div class="temp-wrap" id="tempWrap" style="display:none">
        <span id="tempLabel">25°C</span>
        <input type="range" id="tempSlider" min="-273" max="3000" value="25">
      </div>
      <button id="btnDark" title="Тёмная тема">🌙</button>
    </div>
  </header>
  <div class="content">
    <div id="tableBox"></div>
    <div id="sidePanel">
      <div id="detail"><p class="muted">Наведи на элемент</p></div>
    </div>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
